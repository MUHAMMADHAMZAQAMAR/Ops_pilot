<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="grad-olive" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#bbf246" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#84cc16" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-cyan" cx="45%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-amber" cx="88%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-emerald" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-indigo" cx="75%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Velvet Base -->
  <rect width="1920" height="1080" fill="#0d1117" />

  <!-- Flowing Ambient Glowing Mesh Orbs -->
  <circle cx="280" cy="180" r="480" fill="url(#grad-olive)" />
  <circle cx="860" cy="420" r="540" fill="url(#grad-cyan)" />
  <circle cx="1680" cy="920" r="560" fill="url(#grad-amber)" />
  <circle cx="360" cy="850" r="420" fill="url(#grad-emerald)" />
  <circle cx="1450" cy="220" r="460" fill="url(#grad-indigo)" />
</svg>

